<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#584831"/><stop offset=".18" stop-color="#d9c18d"/><stop offset=".48" stop-color="#715c3c"/><stop offset=".76" stop-color="#c2a875"/><stop offset="1" stop-color="#554630"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#dfcc9b" stop-opacity=".7"/><stop offset=".5" stop-color="#7f6b49" stop-opacity=".45"/><stop offset="1" stop-color="#d5b987" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="plinth" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#786549"/><stop offset=".5" stop-color="#211c1a"/><stop offset="1" stop-color="#a18a60"/>
    </linearGradient>
    <radialGradient id="v"><stop stop-color="#91f5bd"/><stop offset="1" stop-color="#387e5b"/></radialGradient>
    <radialGradient id="e"><stop stop-color="#b5dfff"/><stop offset="1" stop-color="#3d6f9c"/></radialGradient>
    <radialGradient id="r"><stop stop-color="#ffb0ae"/><stop offset="1" stop-color="#994856"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- An open, architectural frame: the three frequencies remain the focal point. -->
  <path d="M42 23H1158L1177 43V553L1150 579H50L23 553V43Z" fill="none" stroke="#241e1b" stroke-width="14"/>
  <path d="M42 23H1158L1177 43V553L1150 579H50L23 553V43Z" fill="none" stroke="url(#bronze)" stroke-width="3"/>
  <path d="M50 32H1150L1168 50V547L1144 570H56L32 547V50Z" fill="none" stroke="url(#edge)" stroke-width="1" opacity=".72"/>
  <path d="M62 43H1138M62 558H1138" stroke="#c8b07f" stroke-opacity=".32" stroke-width="1"/>

  <!-- Engraved corner brackets, inspired by the crystal settings. -->
  <g fill="none" stroke="url(#bronze)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 127V70L72 43H156M45 114Q65 64 121 56M55 87L79 63L99 62" stroke-width="2.4"/>
    <path d="M1155 127V70L1128 43H1044M1155 114Q1135 64 1079 56M1145 87L1121 63L1101 62" stroke-width="2.4"/>
    <path d="M45 473V529L72 556H156M45 486Q65 536 121 544M55 513L79 537L99 538" stroke-width="2.4"/>
    <path d="M1155 473V529L1128 556H1044M1155 486Q1135 536 1079 544M1145 513L1121 537L1101 538" stroke-width="2.4"/>
    <path d="M57 120q18-11 22-34q7 23 25 31M1143 120q-18-11-22-34q-7 23-25 31M57 480q18 11 22 34q7-23 25-31M1143 480q-18 11-22 34q-7-23-25-31" stroke-width="1.1" opacity=".6"/>
  </g>
  <g fill="#d9c38e" opacity=".8">
    <circle cx="54" cy="54" r="2.3"/><circle cx="1146" cy="54" r="2.3"/>
    <circle cx="54" cy="546" r="2.3"/><circle cx="1146" cy="546" r="2.3"/>
  </g>

  <!-- Three subtle bays give the instrument a physical place in the world. -->
  <g fill="none" stroke="#d2ba87" stroke-opacity=".17" stroke-width="1">
    <path d="M105 500V148Q105 108 198 73Q292 108 292 148V500"/>
    <path d="M505 500V148Q505 108 600 73Q695 108 695 148V500"/>
    <path d="M908 500V148Q908 108 1002 73Q1095 108 1095 148V500"/>
    <path d="M118 495V150Q118 121 198 87Q278 121 278 150V495" stroke-dasharray="2 8"/>
    <path d="M518 495V150Q518 121 600 87Q682 121 682 150V495" stroke-dasharray="2 8"/>
    <path d="M922 495V150Q922 121 1002 87Q1081 121 1081 150V495" stroke-dasharray="2 8"/>
  </g>
  <g stroke="#c7ae79" stroke-opacity=".23" fill="none">
    <path d="M397 94V485M802 94V485" stroke-dasharray="1 9"/>
    <path d="M397 112l-7 12 7 12 7-12zM802 112l-7 12 7 12 7-12z"/>
    <path d="M397 463l-7 12 7 12 7-12zM802 463l-7 12 7 12 7-12z"/>
  </g>

  <!-- The base has three inlays, one for each school of resonance. -->
  <path d="M103 560H1097L1077 585H123Z" fill="url(#plinth)" stroke="url(#bronze)" stroke-width="2"/>
  <path d="M126 563H1074M143 581H1057" stroke="#d6bb85" stroke-opacity=".52"/>
  <g stroke="#e1cc9f" stroke-width="1.3">
    <path d="M198 566l8 8-8 8-8-8z" fill="url(#v)"/>
    <path d="M600 566l8 8-8 8-8-8z" fill="url(#e)"/>
    <path d="M1002 566l8 8-8 8-8-8z" fill="url(#r)"/>
  </g>
  <g fill="none" stroke="#d2b980" stroke-opacity=".55" stroke-width="1">
    <path d="M228 574H418l13-6 13 6h129M627 574h129l13-6 13 6h190"/>
    <path d="M188 555v-7m20 7v-7m382 7v-7m20 7v-7m382 7v-7m20 7v-7"/>
  </g>
</svg>
